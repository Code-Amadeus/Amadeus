[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus"
version = "0.1.0"
description = "Amadeus runtime: voice, chat runtime, provider host, and work ledger."
requires-python = ">=3.12,<3.13"

# Direct dependencies for the supported Electron/headless backend (T1 core:
# chat, work, providers — no audio). Voice and local-model stacks live in
# optional extras below; exact transitive versions and builds live in uv.lock.
dependencies = [
    "aiohttp==3.14.3",
    "beautifulsoup4==4.14.3",
    "boto3==1.43.16",
    "fastapi==0.136.3",
    "google-genai==2.6.0",
    "httpx==0.28.1",
    "mcp==2.0.0",
    "mss==10.2.0",
    "numpy==1.26.4",
    "openai==2.38.0",
    "openai-codex==0.147.0",
    "Pillow==12.3.0",
    "playwright==1.60.0",
    "psutil==7.2.2",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "starlette==1.3.1",
    "typing-extensions==4.15.0",
    "uvicorn==0.48.0",
    "websocket-client==1.9.0",
    "websockets==16.0",
]

[project.optional-dependencies]
# L2 voice interaction layer: playback, capture, echo cancellation, remote
# TTS/ASR. Torch-free on purpose: L2 stays a few hundred MB.
voice = [
    "PyAudio==0.2.14",
    "aec-audio-processing==1.0.1",
    "av==17.0.1",
    "ffmpeg-python==0.2.0",
    "scipy==1.17.1",
    "soundfile==0.13.1",
]
# L3 realtime interruption is a capability, independent of the Torch build.
# Select torch-cpu for the CPU VAD profile or local-cu124 for local CUDA models.
vad = [
    "silero-vad==6.2.1",
]
torch-cpu = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
]
# T2b local model stack observed in the working Windows / Python 3.12 / cu124
# environment. Includes the voice layer transitively (installed alongside).
# torch/torchaudio are declared with bare versions here; when this extra is
# active on Windows, [tool.uv.sources] below redirects them to the cu124 index.
# flash-attn is deliberately absent: Qwen ASR already falls back to Torch SDPA,
# while no reproducible Windows cp312 wheel exists in the supported install path.
local-cu124 = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "onnxruntime==1.26.0",
    "accelerate==1.12.0",
    "cn2an==0.5.24",
    "funasr==1.3.7",
    "g2p-en==2.1.0",
    "g2pk2==0.0.3",
    "gradio>=6.16.0,<7",
    "huggingface-hub==0.36.2",
    "hydra-core>=1.3.4,<2",
    "jieba==0.42.1",
    "jieba-fast==0.53",
    "ko-pron==1.3",
    "librosa==0.11.0",
    "matplotlib==3.10.9",
    "msgpack>=1.2.1,<2",
    "nltk>=3.10.0,<4",
    "numba==0.65.1",
    "OpenCC==1.3.1",
    "peft==0.19.1",
    "pytorch-lightning==2.6.4",
    "pyopenjtalk-plus==0.4.1.post9",
    "pypinyin==0.55.0",
    "qwen-asr==0.0.6",
    "rotary-embedding-torch==0.8.9",
    "sentencepiece==0.2.1",
    "split-lang==2.1.1",
    "ToJyutping==3.2.0",
    "tokenizers==0.22.1",
    "torchmetrics==1.5.0",
    "tqdm==4.67.3",
    "transformers==4.57.6",
    "wordsegment==1.3.1",
    "x-transformers==2.19.6",
]
# Experimental Windows ROCm build. It intentionally mirrors the qualified
# local-model capability set while selecting AMD's fixed 7.2.1 PyTorch wheels.
# ASR and TTS run as separate processes but share this project's single .venv.
local-rocm = [
    "torch==2.9.1; sys_platform == 'win32'",
    "torchaudio==2.9.1; sys_platform == 'win32'",
    "torchvision==0.24.1; sys_platform == 'win32'",
    "rocm-sdk-core==7.2.1; sys_platform == 'win32'",
    "rocm-sdk-devel==7.2.1; sys_platform == 'win32'",
    "rocm-sdk-libraries-custom==7.2.1; sys_platform == 'win32'",
    "rocm==7.2.1; sys_platform == 'win32'",
    "onnxruntime==1.26.0; sys_platform == 'win32'",
    "accelerate==1.12.0; sys_platform == 'win32'",
    "cn2an==0.5.24; sys_platform == 'win32'",
    "funasr==1.3.7; sys_platform == 'win32'",
    "g2p-en==2.1.0; sys_platform == 'win32'",
    "g2pk2==0.0.3; sys_platform == 'win32'",
    "gradio>=6.16.0,<7; sys_platform == 'win32'",
    "huggingface-hub==0.36.2; sys_platform == 'win32'",
    "hydra-core>=1.3.4,<2; sys_platform == 'win32'",
    "jieba==0.42.1; sys_platform == 'win32'",
    "jieba-fast==0.53; sys_platform == 'win32'",
    "ko-pron==1.3; sys_platform == 'win32'",
    "librosa==0.11.0; sys_platform == 'win32'",
    "matplotlib==3.10.9; sys_platform == 'win32'",
    "msgpack>=1.2.1,<2; sys_platform == 'win32'",
    "nltk>=3.10.0,<4; sys_platform == 'win32'",
    "numba==0.65.1; sys_platform == 'win32'",
    "OpenCC==1.3.1; sys_platform == 'win32'",
    "peft==0.19.1; sys_platform == 'win32'",
    "pytorch-lightning==2.6.4; sys_platform == 'win32'",
    "pyopenjtalk-plus==0.4.1.post9; sys_platform == 'win32'",
    "pypinyin==0.55.0; sys_platform == 'win32'",
    "qwen-asr==0.0.6; sys_platform == 'win32'",
    "rotary-embedding-torch==0.8.9; sys_platform == 'win32'",
    "sentencepiece==0.2.1; sys_platform == 'win32'",
