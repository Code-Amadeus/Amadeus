[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-example-mimo-tts"
version = "0.1.0"
description = "Experimental out-of-tree MiMo speech contribution for Amadeus"
requires-python = ">=3.12"
dependencies = ["amadeus-extension-sdk==0.1.0"]

[project.entry-points."amadeus.extensions"]
"com.example.mimo-tts" = "amadeus_example_mimo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amadeus_example_mimo = ["amadeus-extension.json"]
