[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-example-csv-audit-skill"
version = "0.1.0"
description = "Audit a small supplied CSV using packaged data quality rules"
requires-python = ">=3.12"

[project.entry-points."amadeus.extensions"]
"com.example.csv-audit-skill" = "amadeus_example_csv_audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amadeus_example_csv_audit = ["amadeus-extension.json", "skills/csv-audit/SKILL.md", "skills/csv-audit/references/*.json"]
