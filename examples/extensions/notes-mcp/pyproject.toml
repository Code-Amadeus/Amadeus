[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-example-notes-mcp"
version = "0.1.0"
description = "Independent local notes MCP package for Amadeus Work Providers"
requires-python = ">=3.12"

[project.entry-points."amadeus.extensions"]
"com.example.notes-mcp" = "amadeus_example_notes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amadeus_example_notes = ["amadeus-extension.json"]
