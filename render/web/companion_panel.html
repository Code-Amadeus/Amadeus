<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:*">
  <title>Amadeus · Companion</title>
  <link rel="stylesheet" href="companion_panel.css">
</head>
<body>
  <main class="companion-card">
    <header><span class="brand">A M A D E U S</span><span class="link-label">HOLO-LINK</span>
      <button id="dock" title="停靠到游戏旁边" aria-label="停靠到游戏旁边">⊞</button>
      <button id="close" title="收起面板，继续语音和游戏" aria-label="收起面板">×</button>
    </header>
    <section class="dialogue">
      <div class="portrait"><img id="portrait" alt="牧濑红莉栖" hidden><span id="fallback">A</span><div class="scanlines"></div></div>
      <div class="speech"><strong>牧瀬 紅莉栖</strong><p id="caption" tabindex="0">正在连接…</p></div>
    </section>
    <footer><span class="signal" aria-hidden="true">▂▅▃▇▂▆▃</span><span id="status" role="status">CONNECTING</span><span class="drag-hint">拖动顶部调整位置</span></footer>
  </main>
  <script src="companion_presentation.js"></script>
  <script src="companion_panel.js"></script>
</body>
</html>
