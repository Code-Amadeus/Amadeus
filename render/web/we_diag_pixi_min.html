<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WE Pixi Diagnostic</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
    }
    #badge {
      position: fixed;
      right: 14px;
      top: 14px;
      z-index: 2147483647;
      padding: 6px 9px;
      border: 1px solid rgba(130, 255, 220, 0.75);
      background: rgba(0, 18, 22, 0.78);
      color: #86ffd7;
      font: 13px/1.2 Consolas, monospace;
    }
  </style>
</head>
<body>
  <div id="badge">WE PIXI 0</div>
  <script src="/render/web/vendor/pixi.min.js"></script>
  <script>
    var app = new PIXI.Application({
      resizeTo: window,
      backgroundColor: 0x05070b,
      backgroundAlpha: 1,
      autoDensity: true,
      resolution: window.devicePixelRatio || 1,
      antialias: true
    });
    document.body.appendChild(app.view);
    var texture = PIXI.Texture.from("../assets/images/amadeus_desktop_wallpaper.png");
    var bg = new PIXI.Sprite(texture);
    app.stage.addChild(bg);
    function layout() {
      var sw = app.screen.width;
      var sh = app.screen.height;
      var iw = texture.baseTexture.width || 1672;
      var ih = texture.baseTexture.height || 941;
      var scale = Math.max(sw / iw, sh / ih);
      bg.width = iw * scale;
      bg.height = ih * scale;
      bg.x = (sw - bg.width) / 2;
      bg.y = (sh - bg.height) / 2;
    }
    app.ticker.add(layout);
    var n = 0;
    setInterval(function () {
      n += 1;
      document.getElementById("badge").textContent = "WE PIXI " + n;
    }, 1000);
  </script>
</body>
</html>
