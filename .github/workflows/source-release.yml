name: Source Release

on:
  pull_request:
    paths:
      - release/**
      - LICENSES/**
      - vendor/**
      - THIRD_PARTY_NOTICES.md
      - pyproject.toml
      - uv.lock
      - electron/package.json
      - electron/package-lock.json
      - scripts/**
      - wallpaper/**
      - electron/scripts/build-windows-wallpaper.cjs
      - tools/build_source_release.py
      - tools/stage_japanese_dictionary.py
      - tools/probes/verify_bundled_dictionary.py
      - electron/scripts/build-runtime-resources.cjs
      - electron/electron-builder-code-only.cjs
      - config/japanese_dictionary.py
      - tests/test_bundled_japanese_dictionary.py
      - tools/check_third_party_provenance.py
      - tests/test_release_tooling.py
      - .github/workflows/source-release.yml
  workflow_dispatch:
    inputs:
      dictionary_url:
        description: "HTTPS URL of the exact pinned resource (required for full application archives)"
        type: string
        required: false
      code_only:
        description: "Build an explicitly labelled developer archive without runtime resources"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source-archive:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Verify included third-party provenance
        run: python tools/check_third_party_provenance.py --release-ready

      - name: Select distribution inputs
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_ONLY: ${{ inputs.code_only }}
          DICTIONARY_URL: ${{ inputs.dictionary_url }}
        run: |
          $codeOnly = $env:EVENT_NAME -eq 'pull_request' -or $env:CODE_ONLY -eq 'true'
          if ($codeOnly) {
            "SOURCE_ARCHIVE=amadeus-code-only.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CODE_ONLY_DISTRIBUTION=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            $pin = Get-Content release/japanese_dictionary.json -Raw | ConvertFrom-Json
            $url = $env:DICTIONARY_URL
            if (!$url) { $url = $pin.download_url }
            if (!$url -or ([uri]$url).Scheme -ne 'https') {
              throw 'Full application archives require the pinned dictionary URL; resources must be accepted and supplied before release.'
            }
            New-Item -ItemType Directory -Force build/release-inputs | Out-Null
            Invoke-WebRequest -Uri $url -OutFile build/release-inputs/japanese-dictionary.zip
            "SOURCE_ARCHIVE=amadeus-source.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CODE_ONLY_DISTRIBUTION=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build deterministic source archive
        shell: pwsh
        run: |
          $resourceArgs = @('--dictionary-bundle', 'build/release-inputs/japanese-dictionary.zip')
          if ($env:CODE_ONLY_DISTRIBUTION -eq 'true') { $resourceArgs = @('--code-only') }
          python tools/build_source_release.py --manifest-output build/release/source-manifest.json --output "dist/$env:SOURCE_ARCHIVE" @resourceArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$env:SOURCE_ARCHIVE").Hash.ToLowerInvariant()
          "$hash  $env:SOURCE_ARCHIVE" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      # Repository builds cannot detect files missing from the allowlisted ZIP.
      # Install and launch the packaged frontend using only extracted sources.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.21.1"

      - uses: actions/setup-dotnet@v5
        with:
          # Pin the same SDK resolved by 8.0.x; avoid its broken aka.ms blob redirect.
          dotnet-version: '8.0.427'

      - name: Install pinned uv
        run: python -m pip install uv==0.12.8

      - name: Extract the release archive
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "dist/$env:SOURCE_ARCHIVE" -DestinationPath build/source-smoke
          $manifest = Get-Content build/release/source-manifest.json -Raw | ConvertFrom-Json
          $sourceRoot = Join-Path $PWD "build/source-smoke/amadeus-$($manifest.version)"
          "SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python from extracted sources
        working-directory: ${{ env.SOURCE_ROOT }}
        run: uv sync --locked --extra dev

      - name: Verify extracted Python environment
        working-directory: ${{ env.SOURCE_ROOT }}
        run: uv run --locked --no-sync python tools/verify_python_environment.py --profile ci

      - name: Verify the extracted bundled dictionary with the native frontend
        if: env.CODE_ONLY_DISTRIBUTION == 'false'
        working-directory: ${{ env.SOURCE_ROOT }}
        run: >-
          uv run --locked --no-sync --with pyopenjtalk-plus==0.4.1.post9
          python -X utf8 tools/probes/verify_bundled_dictionary.py
          --output build/source-release-smoke/dictionary-source.json

      - name: Install Electron and Pi from extracted sources
        working-directory: ${{ env.SOURCE_ROOT }}/electron
        run: npm ci

      - name: Build extracted Electron sources
        working-directory: ${{ env.SOURCE_ROOT }}/electron
        run: npm run build

      - name: Verify previous-release settings upgrade
        working-directory: ${{ env.SOURCE_ROOT }}/electron
        run: >-
          node -e "require('node:child_process').execFileSync(require('electron'),
          ['scripts/smoke-settings-upgrade.cjs', 'v0.17.0-alpha.0'],
          {stdio: 'inherit', windowsHide: true, timeout: 45000})"

      - name: Package extracted Windows sources
        working-directory: ${{ env.SOURCE_ROOT }}/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: pwsh
        run: |
          $configArgs = @()
          if ($env:CODE_ONLY_DISTRIBUTION -eq 'true') { $configArgs = @('--config', 'electron-builder-code-only.cjs') }
          npx electron-builder --win --x64 --dir --publish never @configArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the dictionary carried by the Electron package
        if: env.CODE_ONLY_DISTRIBUTION == 'false'
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: pwsh
        run: |
          $env:AMADEUS_BUNDLED_JAPANESE_DICTIONARY = Join-Path $PWD 'electron/build/win-unpacked/resources/assets/bundled/japanese-pronunciation'
          uv run --locked --no-sync --with pyopenjtalk-plus==0.4.1.post9 python -X utf8 tools/probes/verify_bundled_dictionary.py --output build/source-release-smoke/dictionary-electron.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launch packaged application from the source archive
        working-directory: ${{ env.SOURCE_ROOT }}
        run: >-
          uv run --locked --no-sync python -X utf8 tools/smoke_electron_model_less.py
          --packaged-executable electron/build/win-unpacked/amadeus-desktop.exe
          --report-dir build/source-release-smoke

      - name: Upload archive smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: source-release-smoke
          path: build/source-smoke/**/build/source-release-smoke/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SOURCE_ARCHIVE }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            build/release/source-manifest.json
          if-no-files-found: error
