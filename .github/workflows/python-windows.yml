name: Python Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-model-less:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AMADEUS_E2E_NO_TTS: "1"
      TTS_DEVICE: "cpu"
      WORK_WORKTREE_ISOLATION: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Install pinned uv
        run: python -m pip install uv==0.12.8

      - uses: actions/setup-node@v7
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install locked environment (L1 + dev tooling)
        shell: bash
        run: uv sync --locked --extra dev

      - name: Verify environment
        run: uv run --locked --no-sync python tools/verify_python_environment.py --profile ci

      - name: Check source and architecture views
        # bash (not pwsh): Actions runs bash with -e, so a ruff failure must
        # fail the step instead of being masked by the next command's exit 0.
        shell: bash
        run: |
          uv run --locked --no-sync python -m ruff check .
          uv run --locked --no-sync python tools/architecture/generate_views.py --check

      - name: Audit Python dependencies
        # Accepted until the already-green suite is qualified on pytest 9.
        run: >-
          uv run --locked --no-sync python -m pip_audit --local --progress-spinner off
          --ignore-vuln PYSEC-2026-1845

      - name: Run Python suites
        run: uv run --locked --no-sync python -X utf8 tools/run_tests.py

      - name: Build Electron model-less smoke target
        working-directory: electron
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Run Electron model-less smoke
        run: >-
          uv run --locked --no-sync python -X utf8 tools\smoke_electron_model_less.py
          --report-dir build\electron-smoke

      - name: Upload Electron smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: electron-model-less-smoke-${{ github.run_id }}
          path: build/electron-smoke/**
          if-no-files-found: ignore

  # Windows clean-install proof of the single-.venv L1 → L4 ladder: the same
  # .venv is upgraded in place, torch flips to the +cu124 build, and no second
  # venv (e.g. .venv_cu124) is ever created.
  single-venv-ladder:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      AMADEUS_E2E_NO_TTS: "1"
      TTS_DEVICE: "cpu"
      WORK_WORKTREE_ISOLATION: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Install pinned uv
        run: python -m pip install uv==0.12.8

      - name: L1 core
        shell: bash
        run: |
          uv sync --locked
          uv run --locked --no-sync python tools/verify_python_environment.py --profile cpu
          uv run --locked --no-sync python -c "import importlib.util as u; assert all(u.find_spec(n) is None for n in ('torch', 'torchaudio', 'pyaudio', 'silero_vad', 'onnxruntime'))"
      - name: L2 voice
        shell: bash
        run: |
          uv sync --locked --extra voice
          uv run --locked --no-sync python tools/verify_python_environment.py --profile voice
          uv run --locked --no-sync python -c "import importlib.util as u; assert u.find_spec('torch') is None"
      - name: L3 CPU VAD
        shell: bash
        run: |
          uv sync --locked --extra voice --extra vad --extra torch-cpu
          uv run --locked --no-sync python tools/verify_python_environment.py --profile vad-cpu
      - name: L4 local-cu124
        run: uv sync --locked --extra voice --extra vad --extra local-cu124

      - name: Assert single venv and cu124 torch
        shell: bash
        run: |
          test ! -d .venv_cu124 && test ! -d .venv_pt251 || { echo "second venv created"; exit 1; }
          uv run --locked --no-sync python -c "import torch; assert torch.__version__.endswith('+cu124'), torch.__version__; print('torch', torch.__version__)"
          # cu124 wheel presence (build target), not a CUDA device: hosted runners have no GPU.
          uv run --locked --no-sync python tools/verify_python_environment.py --profile cu124

      - name: Return to CPU VAD and core
        shell: bash
        run: |
          uv sync --locked --extra voice --extra vad --extra torch-cpu
          uv run --locked --no-sync python tools/verify_python_environment.py --profile vad-cpu
          uv sync --locked
          uv run --locked --no-sync python tools/verify_python_environment.py --profile cpu
          uv run --locked --no-sync python -c "import importlib.util as u; assert all(u.find_spec(n) is None for n in ('torch', 'torchaudio', 'pyaudio', 'silero_vad', 'onnxruntime', 'qwen_asr'))"

      - name: Upload wheelhouse diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ladder-${{ github.run_id }}
          path: |
            uv.lock
          if-no-files-found: ignore
