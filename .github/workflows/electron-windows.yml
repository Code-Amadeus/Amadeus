name: Electron Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install locked dependencies
        run: npm ci

      - name: Verify default Pi runtime starts
        run: node ../agent_host/pi_runtime/node_modules/@earendil-works/pi-coding-agent/dist/cli.js --version

      - name: Test renderer projections
        run: npm test

      - name: Typecheck and build renderer
        run: npm run build

      - name: Test Windows wallpaper lifecycle contracts
        run: dotnet run --project ../wallpaper/windows/Amadeus.Wallpaper.Tests

      - name: Build the unpacked Windows application including beforePack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --dir --publish never

      - name: Smoke packaged wallpaper startup resources and native tray
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'build/wallpaper-smoke.stdout.log'
          $err = Join-Path $PWD 'build/wallpaper-smoke.stderr.log'
          $script = Join-Path $PWD 'scripts/smoke-windows-wallpaper.cjs'
          $resources = Join-Path $PWD 'build/win-unpacked/resources'
          $exe = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $probe = Start-Process -FilePath $exe -ArgumentList @(('"' + $script + '"'), ('"' + $resources + '"')) -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (!$probe.WaitForExit(60000)) { Stop-Process -Id $probe.Id; throw 'Wallpaper package smoke timed out' }
          Get-Content $out
          Get-Content $err
          if ($probe.ExitCode -ne 0) { throw "Wallpaper package smoke failed: $($probe.ExitCode)" }

      - name: Upload wallpaper package smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-wallpaper-package-smoke
          path: electron/build/wallpaper-smoke.*.log
          if-no-files-found: ignore

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          retry-on-snapshot-warnings: true
          # NLTK has no patched release for its listed API bug. qwen-asr 0.0.6
          # requires transformers 4.57.6 exactly. Amadeus uses neither the
          # affected NLTK persistence APIs nor Transformers LightGlue/save APIs;
          # all Transformers model loading is local and forced offline. See
          # the runtime enforcement and cached-session regression in
          # config/local_model_loading.py and tests/test_local_model_loading.py.
          # Keep exceptions advisory-specific and remove each once compatible fixes
          # are published.
          allow-ghsas: >-
            GHSA-8mgp-746c-j5xp,
            GHSA-29pf-2h5f-8g72,
            GHSA-fgcw-684q-jj6r,
            GHSA-xrqw-3rrv-vx5w
