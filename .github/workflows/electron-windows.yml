name: Electron Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test renderer projections
        run: npm test

      - name: Typecheck and build renderer
        run: npm run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          retry-on-snapshot-warnings: true
          # NLTK has no patched release for this advisory. Amadeus only uses
          # TweetTokenizer and pos_tag; it never exposes the affected model
          # persistence APIs or caller-selected artifact paths. Remove this
          # single-advisory exception when NLTK publishes a fixed version.
          allow-ghsas: GHSA-8mgp-746c-j5xp
