name: Electron Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test renderer projections
        run: npm test

      - name: Typecheck and build renderer
        run: npm run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          retry-on-snapshot-warnings: true
          # NLTK has no patched release for its listed API bug. qwen-asr 0.0.6
          # requires transformers 4.57.6 exactly. Amadeus uses neither the
          # affected NLTK persistence APIs nor Transformers LightGlue/save APIs;
          # all Transformers model loading is local and forced offline. Keep the
          # exceptions advisory-specific and remove each once compatible fixes
          # are published.
          allow-ghsas: >-
            GHSA-8mgp-746c-j5xp,
            GHSA-29pf-2h5f-8g72,
            GHSA-fgcw-684q-jj6r,
            GHSA-xrqw-3rrv-vx5w
