name: Python macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  voice-tier:
    # macOS product path is T1 core + T2 remote voice: install T1+T2, verify
    # the voice import contract (brew portaudio → PyAudio source build), lint,
    # run platform-safe contract tests, and compile the Electron renderer.
    runs-on: macos-14
    timeout-minutes: 40
    env:
      AMADEUS_E2E_NO_TTS: "1"
      TTS_DEVICE: "cpu"
      WORK_WORKTREE_ISOLATION: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Install PortAudio (PyAudio source-build prerequisite)
        run: brew install portaudio

      - uses: actions/setup-python@v7
        with:
          # Bootstrap uv only; qualify the application's uv-managed interpreter below.
          python-version: "3.12.10"

      - name: Install pinned uv
        run: python -m pip install uv==0.12.8

      - uses: actions/setup-node@v7
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install locked environment (T1 + T2 voice)
        run: |
          uv python install 3.12.14
          uv venv .venv --python 3.12.14 --managed-python
          uv sync --locked --extra voice --extra dev

      - name: Verify environment (voice profile)
        run: uv run --locked --no-sync python tools/verify_python_environment.py --profile voice

      - name: Verify native VN portrait Tk and ImageTk
        timeout-minutes: 2
        run: uv run --locked --no-sync python tools/verify_vn_portrait_environment.py

      - name: Check source and architecture views
        shell: bash
        run: |
          uv run --locked --no-sync python -m ruff check .
          uv run --locked --no-sync python tools/architecture/generate_views.py --check

      - name: Run platform-safe contract suites
        # Whitelist: pure contract tests with no Windows-specific behavior or
        # browser/Electron spawning. Grown deliberately from the platform-safe
        # set; mac-wide full-suite qualification is a separate effort.
        run: >-
          uv run --locked --no-sync python -m pytest -q
          tests/test_profile_contract.py
          tests/test_python_environment_verifier.py
          tests/test_vn_portrait_environment.py
          tests/test_cu124_dependency_audit_tool.py
          tests/test_core_install_tiers.py
          tests/test_asset_paths.py
          tests/test_system_settings.py
          tests/test_voice_backend_registry.py
          tests/test_extension_examples.py
          tests/test_extension_resources.py
          tests/test_electron_model_less_smoke.py
          tests/test_mic_descriptor.py
          tests/test_aec_native_smoke.py
          tests/test_playback_device_recovery.py
          tests/test_tts_contract.py
          tests/test_tts_fish_audio_backend.py
          tests/test_tts_cache_backend_boundary.py

      - name: Build Electron renderer (macOS)
        working-directory: electron
        run: |
          npm ci
          node ../agent_host/pi_runtime/node_modules/@earendil-works/pi-coding-agent/dist/cli.js --version
          npm test
          npm run build

      - name: Run Electron model-less smoke (macOS)
        run: >-
          uv run --locked --no-sync python tools/smoke_electron_model_less.py
          --report-dir build/electron-smoke

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: electron-macos-smoke-${{ github.run_id }}
          path: build/electron-smoke/**
